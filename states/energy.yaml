---
name: Energy
description: level of energy for doing things
examples:
  major_decrease: heavy physical or mental work, tension release
  minor_decrease: listening to uninteresting monologues, doing work
  minor_increase: talking to someone intersting, falling in love, refreshment
  major_increase: stimulants, energy drinks, thrill, huge excitement
base: 80
change:
  default: -4
  move: -5
  sleep: +8
  context: [-2, -1, +2, +4]
intervals:
  - values: [0, 10]
    effect: 'You desperately need to sleep. You can no longer think or do anything except going to sleep.'
  - values: [11, 20]
    effect: 'You are so tired, you cannot think straight and or stop yawning.'
  - values: [21, 30]
    effect: 'You are tired and yawn occasionally.'
  - values: [31, 40]
    effect: 'You begin to feel tired.'
  - values: [81, 100]
    effect: 'You are bursting with energy.'
events:
  - below: 20
    hint: '%selfname% yawns and looks tired.'
  - below: 5
    hint: '%selfname% can hardly keep their sleepy eyes open anymore.'
