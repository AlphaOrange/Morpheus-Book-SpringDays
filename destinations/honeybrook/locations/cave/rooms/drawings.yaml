---
name: Wall Drawings
description: >-
  Candles illuminate the dark cave.
  Don't look up, where massive stalactites loom and spiders spin their webs.
  But what is that on the wall: a goat, a bull, a three-headed monkey?
description_detailed: >-
  A part of the cave with massive pointy stalactites looming between spide webs, but a relatively even floor between big boulders.
  Multiple candles on the floor bathe the cave in a flickering orange glow and illuminate the ancient drawings on one of the walls. There is a goat, a bull, some figures holding spears.
