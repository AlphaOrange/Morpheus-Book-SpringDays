name: The Crypt
conditions: "fantasy"
description: >-
  A broken fence, a stone coffin, moonlight as if from a moonless night.
  Were they trying to lock something in or keep someone out? You, for example.
description_detailed: >-
  The cave opens here into a partially collapsed cavern, which has been separated by a decorative iron fence.
  Although the only door is kept locked by a thick padlock, there is also a large hole in the middle of the fence through which one can enter the cavern.
  Inside stands a massive stone coffin that is nearly impossible to open. Dust hangs in the air, and a cold light filters in from somewhere. The floor is uneven and littered with rubble.
