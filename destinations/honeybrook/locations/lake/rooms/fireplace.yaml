---
name: Shore Fireplace
description: >-
  This place has seen its fair share of late nights.
  The fire pit, the log benches, the hammock — everything is ready for the next cozy gathering.
  And as a refreshment, there's always the beautiful lake.
description_detailed: >-
  On an earthy spot at the lake's shore there is a simple extinguished fire pit with a grill grate. Around it there are two big logs to sit on and a bit further away a hammock is strung between two trees.
  The water here is very shallow and crystal clear.
  This is a very cozy place for both wild gatherings and romantic togetherness.
