---
name: Dorm Hall
description: >-
  The busy entry hall of the dorm, students walking in and out all the time.
  Here you can admire the trophies the university's sports teams won,
  gleaming on their shiny displays.
description_detailed: >-
  The dorm's entrance hall is polished to a high shine; the floor reflects the light streaming in from the large windows. Students are constantly walking through the hall.
  A trophy case displays the sports teams' trophies. A few abandoned backpacks sit in front of the bulletin board with requests and offers. A few plants add a touch of greenery to the hall.
  Half a dozen doors lead to common rooms, bathrooms, and the dining hall, and a staircase leads upstairs to the living quarters.
