name: Room 4 (Danielle and Mona)
description: >-
  Danielle and Mona's dorm room.
  The posters and jerseys make it clear: here live real athletes!
  Everything else - like day and night. Literally.
description_detailed: >-
  The shared room of Danielle and Mona, Danielle's bed on the right, Mona's on the left. Athletics is the shared theme as the runner poster on Monas side, the jersey on the wall of Danielle's side and the basketball on the desk show.
  While Danielle's side looks tidy and friendly, on Mona's side chaos and dark colors dominate. On the bed and on the floor in front of it shirts, jackets, skirts and bras in different shades of black and grey lie around as well as running shoes and black high heels.
  On the box under Mona's bed there is a broken heart scribbled. On the desk on her side stands a gothic-style jewelry box with neclaces, rings and earrings.
  The window blinds are opened and allow a look at the woods.
