description_detailed: >-
  The shared room of Finn and Noah. Finns bunk bed on the right side looks tidy, there are three cute cat posters on the wall.
  The rest of the room, starting with Noah's bed in front of the window is extremely messy and downright dirty. Noah's clothes lie just everywere, particularly on the floor. There is crumpled paper everywhere.
  On the only desk there are two empty boxes of chinese food, Finn's laptop and some boxes of boardgames. On the wall behind the desk are posters of Cristo Redentor.
  A garbage can right next to the desk seems to be rarely used.
