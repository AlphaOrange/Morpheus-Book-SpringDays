description_detailed: >-
  The shared room of Kira and Jessabel has no natural light and a rather spooky atmosphere. The blinds are fully closed, the room is illuminated by some fairy lights on Kira's side and a blueish moon light on Jessabel's side.
  Kira's bed is decorated with two cat-shaped pillows, one orange, one black, and multiple anatomy posters on the wall. A book shelf and some bottles of tomato juice stand nearby.
  Decorative bats are hanging from the ceiling.
  On Jessabel's bed lies a sleeping mask and there are patches of grey fur on the floor.
