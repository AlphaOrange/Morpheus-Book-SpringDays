---
name: The Fountain
description: >-
  The birds are chirping, people are strolling by and chatting,
  and the fountain is splashing with crystal-clear water, ready to offer refreshment.
description_detailed: >-
  The fountain is in the center of the town plaza. It consists of a large water basin with stacked fountains in the middle. The fountain in the center shoots water five meters high.
  The ground around it is paved with pretty stones.
  On either side, you can see various quaint shops and restaurants.
  Everything is clean, and everything is very cozy. It has a real vacation village vibe.
