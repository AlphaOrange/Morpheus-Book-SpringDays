---
name: Silverplate's Curiosities
description: >-
  A glass of Scottish highland fog, anti-slip nail polish, ancient prosperity items,
  a globe that shows Terra Australis, stuffed animals you've never seen in real life.
  And that's just the display.
description_detailed: >-
  The curio shop is crammed with strange objects, decorations, books, and things with no apparent purpose. A wide variety of lamps bathe the shop in a dim light.
  On the counter is a wooden globe, under the coutner a glass display case filled with exotic jewelry, behind the counter a tea station.
  Every wall is completely covered by floor-to-ceiling shelves filled with seemingly random curiosities, some of them extremely strange like a glass of Scottish highland fog, anti-slip nail polish, ancient prosperity items or stuffed animals you've never seen in real life.
  The floor in the entrance area is littered with unopened boxes. On the back wall there is a large wooden sign "Silverplate's".
